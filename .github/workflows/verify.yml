name: Verify CodeContext

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Static checks
        run: |
          pnpm run typecheck
          pnpm run lint
      - name: Dependency vulnerability audit
        run: pnpm audit
      - name: Unit and integration tests
        run: pnpm test
      - name: Build production extension
        run: pnpm run build
      - name: Browser, accessibility, and real AST checks
        run: pnpm run test:e2e
      - name: Verify packaged release
        run: |
          pnpm run release
          pnpm run verify:release
      - name: Upload verified release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-v${{ github.sha }}-release
          path: |
            release/*.zip
            release/*-manifest.json
            release/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
